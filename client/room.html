<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusMeet Room</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/whiteboard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366F1'><path d='M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z'/></svg>">
</head>
<body>
  <div class="room-container">
    <!-- Top Header Bar -->
    <header class="room-header">
      <div class="room-meta">
        <a href="/" class="brand" style="font-size: 1.15rem;">
          <div class="brand-icon" style="width: 28px; height: 28px;">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </div>
          <span>NexusMeet</span>
        </a>
        <div class="room-tag" id="roomTag">#room</div>
        <div class="security-badge" title="Media encrypted with DTLS-SRTP, Chat & Whiteboard with AES-GCM 256-bit">
          <span>🔒 E2EE Active</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button id="copyLinkBtn" class="btn btn-secondary" style="padding: 0.4rem 0.85rem; font-size: 0.85rem;">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span>Invite Link</span>
        </button>
      </div>
    </header>

    <!-- Main Room Body -->
    <main class="room-body">
      <!-- Video Grid Stage -->
      <section class="video-stage">
        <div class="video-grid" id="videoGrid">
          <!-- Local User Card -->
          <div class="video-card" id="localVideoCard">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="avatar-placeholder" id="localAvatar" style="display: none;">
              <div class="avatar-circle" id="localAvatarCircle">U</div>
              <span id="localAvatarName">You</span>
            </div>
            <div class="video-card-overlay">
              <div class="video-user-badge">
                <span id="localUserName">You</span>
                <span id="localAudioBadge" style="display:none; color: var(--danger);">🔇</span>
              </div>
              <div class="video-actions">
                <button class="video-btn-sm" title="Pin Video" onclick="togglePinCard('localVideoCard')">📌</button>
                <button class="video-btn-sm" title="Fullscreen" onclick="toggleFullscreen('localVideoCard')">⛶</button>
              </div>
            </div>
          </div>
          <!-- Remote Peer cards injected here dynamically -->
        </div>

        <!-- Collaborative Whiteboard Fullscreen Overlay -->
        <div class="whiteboard-container" id="whiteboardOverlay">
          <div class="wb-wrapper">
            <!-- Whiteboard Floating Toolbar -->
            <div class="wb-toolbar">
              <button class="wb-btn active" id="wb_tool_pen" title="Pen Tool">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_highlighter" title="Highlighter">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_eraser" title="Eraser">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>

              <div class="wb-divider"></div>

              <button class="wb-btn" id="wb_tool_line" title="Straight Line">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_arrow" title="Arrow">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_rect" title="Rectangle">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_circle" title="Circle">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
              </button>
              <button class="wb-btn" id="wb_tool_text" title="Text Note">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M12 6v14"/></svg>
              </button>

              <div class="wb-divider"></div>

              <!-- Color Palette Swatches -->
              <div style="display: flex; gap: 0.25rem; align-items: center;">
                <div class="color-swatch active" data-color="#6366F1" style="background: #6366F1;"></div>
                <div class="color-swatch" data-color="#EF4444" style="background: #EF4444;"></div>
                <div class="color-swatch" data-color="#10B981" style="background: #10B981;"></div>
                <div class="color-swatch" data-color="#F59E0B" style="background: #F59E0B;"></div>
                <div class="color-swatch" data-color="#FFFFFF" style="background: #FFFFFF;"></div>
              </div>

              <div class="wb-divider"></div>

              <!-- Stroke Width Slider -->
              <input type="range" id="wb_stroke_width" min="1" max="24" value="4" style="width: 70px; accent-color: var(--primary);" title="Brush Thickness">

              <div class="wb-divider"></div>

              <button class="wb-btn" id="wb_undo" title="Undo">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
              </button>
              <button class="wb-btn" id="wb_redo" title="Redo">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
              </button>
              <button class="wb-btn" id="wb_clear" title="Clear Canvas" style="color: var(--danger);">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
              <button class="wb-btn" id="wb_export" title="Save PNG">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              </button>
            </div>

            <!-- Canvas Element -->
            <canvas id="whiteboardCanvas" class="wb-canvas"></canvas>
          </div>
        </div>
      </section>

      <!-- Side Drawer Panel -->
      <aside class="room-sidebar collapsed" id="roomSidebar">
        <!-- Sidebar Header with Tabs -->
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn active" id="tabBtnChat">
            <span>💬 Chat</span>
          </button>
          <button class="sidebar-tab-btn" id="tabBtnParticipants">
            <span>👥 People (<span id="participantsCount">1</span>)</span>
          </button>
          <button class="sidebar-tab-btn" id="tabBtnFiles">
            <span>📁 Files</span>
          </button>
          <button class="wb-btn" id="closeSidebarBtn" style="margin-right: 0.5rem; width: 32px; height: 32px;" title="Close Drawer">✕</button>
        </div>

        <!-- Chat Tab Content -->
        <div class="sidebar-tab-content active" id="tabContentChat">
          <div class="chat-messages" id="chatMessages">
            <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin: 0.5rem 0;">
              🔒 Messages in this room are end-to-end encrypted with AES-GCM 256-bit.
            </div>
          </div>
          <div class="chat-input-bar">
            <input type="text" class="form-input" id="chatInput" placeholder="Type an encrypted message..." autocomplete="off">
            <button class="btn btn-primary" id="chatSendBtn" style="padding: 0 1rem;">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
          </div>
        </div>

        <!-- Participants Tab Content -->
        <div class="sidebar-tab-content" id="tabContentParticipants">
          <div class="participant-list" id="participantsList">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Files Tab Content -->
        <div class="sidebar-tab-content" id="tabContentFiles">
          <div class="file-dropzone" id="fileDropzone">
            <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--primary); margin-bottom: 0.5rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <div style="font-size: 0.85rem; font-weight: 600;">Click or Drop File to Share</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Direct P2P transfer over DataChannel</div>
            <input type="file" id="fileInput" style="display: none;">
          </div>
          <div class="file-list" id="fileList">
            <!-- File cards injected here -->
          </div>
        </div>
      </aside>
    </main>

    <!-- Bottom Conference Control Bar -->
    <footer class="room-controls">
      <!-- Toggle Microphone -->
      <button class="control-btn" id="toggleMicBtn" title="Mute/Unmute Mic">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
      </button>

      <!-- Toggle Camera -->
      <button class="control-btn" id="toggleCamBtn" title="Start/Stop Video">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
      </button>

      <!-- Screen Share -->
      <button class="control-btn" id="toggleScreenBtn" title="Share Screen">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </button>

      <!-- Whiteboard -->
      <button class="control-btn" id="toggleWbBtn" title="Collaborative Whiteboard">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
      </button>

      <!-- Chat Drawer -->
      <button class="control-btn" id="toggleChatBtn" title="In-Meeting Chat">
        <span class="badge-count" id="chatUnreadBadge" style="display: none;">0</span>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
      </button>

      <!-- Participants Drawer -->
      <button class="control-btn" id="toggleParticipantsBtn" title="Participants List">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>

      <!-- Files Drawer -->
      <button class="control-btn" id="toggleFilesBtn" title="P2P File Transfer">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </button>

      <!-- Leave Call -->
      <button class="control-btn leave-btn" id="leaveBtn" title="Leave Conference">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
        <span style="font-weight: 600; font-size: 0.9rem; margin-left: 0.4rem;">Leave</span>
      </button>
    </footer>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- App scripts -->
  <script src="/js/auth.js"></script>
  <script src="/js/crypto.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/whiteboard.js"></script>
  <script src="/js/fileshare.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
